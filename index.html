<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosso Casamento</title>
<meta name="theme-color" content="#be185d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casamento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #fdf7f9; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #fdf7f9; }
  .fallback { position: fixed; inset: auto 0 0 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); text-align: center; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #6e5b65; display: none; }
  .fallback a { color: #be185d; font-weight: 700; }
</style>
</head>
<body>
  <!-- O app de verdade roda no Google Apps Script; esta página só dá a ele um endereço curto e um ícone. -->
  <iframe id="app" title="Nosso Casamento" src="https://script.google.com/macros/s/AKfycbyWztgGZs2_lzPVy290WNieX2Q-tArzR01TVGXwNtgKHvNgzgZPyNdrkJgJLDex2t0O/exec" allow="clipboard-write"></iframe>
  <p class="fallback" id="fb">Não abriu? <a href="https://script.google.com/macros/s/AKfycbyWztgGZs2_lzPVy290WNieX2Q-tArzR01TVGXwNtgKHvNgzgZPyNdrkJgJLDex2t0O/exec" target="_top">Abrir o app direto</a></p>
  <script>
    // Se o app não carregar em 12 s, mostra o link direto.
    var ok = false;
    document.getElementById("app").addEventListener("load", function () { ok = true; });
    setTimeout(function () { if (!ok) document.getElementById("fb").style.display = "block"; }, 12000);
  </script>
</body>
</html>
